<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Poster Studio</title>
  <style>
    #save-btn { position: fixed; right: 16px; bottom: 16px; z-index:10000; background:#ff6b6b;color:#fff;border:none;padding:10px 14px;border-radius:6px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2); }
    #save-status { position: fixed; right:16px; bottom:64px; z-index:10000; background:rgba(0,0,0,0.75); color:#fff;padding:6px 8px;border-radius:4px;font-size:13px;display:none; }
  </style>
</head>
<body contenteditable="true">

  <!-- Your poster content lives below. Keep the original HTML here. -->
  <div id="poster-root">
    <h1>Poster Studio</h1>
    <p>Edit this page directly. Click Save to persist changes.</p>
  </div>

  <button id="save-btn">Save</button>
  <div id="save-status"></div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
  (function(){
    const socket = io();
    const saveBtn = document.getElementById('save-btn');
    const status = document.getElementById('save-status');

    function updateStatus(txt, show=true, timeout=3000){
      status.textContent = txt;
      status.style.display = show ? 'block' : 'none';
      if(show && timeout) setTimeout(()=> status.style.display='none', timeout);
    }

    socket.on('connect', ()=> updateStatus('Connected', true, 1500));
    socket.on('disconnect', ()=> updateStatus('Disconnected', true, 0));
    socket.on('save-success', ()=> updateStatus('Saved locally', true, 2000));
    socket.on('save-local', (d)=> updateStatus(d && d.message ? d.message : 'Saved locally', true, 3000));
    socket.on('save-github-success', ()=> updateStatus('Saved to GitHub', true, 3000));
    socket.on('save-error', (d)=> updateStatus('Save error: '+(d && d.message? d.message : 'unknown'), true, 5000));

    function saveToServer(adminPassword){
      const html = document.documentElement.outerHTML;
      socket.emit('save-poster', { html: html, clientId: socket.id, adminPassword: adminPassword || null });
      updateStatus('Saving...', true, 0);
    }

    saveBtn.addEventListener('click', ()=> saveToServer());

    // Ctrl/Cmd+S shortcut
    window.addEventListener('keydown', function(e){
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); saveToServer(); }
    });

    // Double-click Save to prompt for admin password (optional)
    saveBtn.addEventListener('dblclick', ()=>{
      const pass = prompt('Admin save password (optional)');
      if(pass) saveToServer(pass);
    });
  })();
  </script>
</body>
</html>
